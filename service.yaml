apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - port: 4000          # Port inside the cluster
      targetPort: 4000    # Port container is listening on
      nodePort: 30000     # External Minikube port (optional, range 30000-32767)
---
apiVersion: v1
kind: Service
metadata:
  name: delete-student-internal-service
spec:
  type: ClusterIP
  selector:
    app: delete-student
  ports:
    - port: 5000
      targetPort: 5000